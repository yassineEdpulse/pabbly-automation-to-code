<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Automation Code Extractor</title>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>
          <span id="brand">Automation</span>
          <svg class="title-arrow" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 12h15M13 6l6 6-6 6" />
          </svg>
          <span>Code Extractor</span>
        </h1>
        <span id="status" class="status">idle</span>
      </header>

      <div class="row">
        <button type="button" id="refresh" class="primary">Capture / Refresh</button>
        <button type="button" id="clear" class="ghost">Clear</button>
      </div>

      <div class="row">
        <button type="button" id="captureSteps">Auto-capture steps</button>
      </div>

      <div class="row">
        <button type="button" id="exportAll" class="primary">Export ALL</button>
      </div>

      <div id="bulk" class="bulk"></div>

      <div id="inventory" class="inventory"></div>

      <details id="fixer" class="fixer">
        <summary>Find &amp; replace across workflows</summary>
        <label class="fx-label" for="fxFind">Current value</label>
        <input id="fxFind" class="search" type="text" spellcheck="false" autocomplete="off"
               placeholder="secure.tutorcruncher.com" />
        <label class="fx-label" for="fxReplace">Replace with</label>
        <input id="fxReplace" class="search" type="text" spellcheck="false" autocomplete="off"
               placeholder="app.tutorcruncher.com" />
        <div class="row">
          <button type="button" id="fxCollect">Collect workflows</button>
        </div>
        <label class="fx-check"><input type="checkbox" id="fxActiveOnly" /> Active workflows only</label>
        <div id="fxQueueInfo" class="fx-ledger"></div>
        <div class="row">
          <button type="button" id="fxTestOne">Test rule on this workflow</button>
          <button type="button" id="fxApplyOne" class="danger" disabled>Apply to this one</button>
        </div>
        <div class="row">
          <button type="button" id="fxScan" class="primary">Scan (no changes)</button>
          <button type="button" id="fxApply" class="danger" disabled>Apply &amp; Save</button>
        </div>
        <div id="fxLedger" class="fx-ledger"></div>
        <div id="fxReport" class="fx-report"></div>
        <div class="row">
          <button type="button" id="fxExport" class="ghost">Export report</button>
          <button type="button" id="fxReset" class="ghost">Reset ledger</button>
        </div>
      </details>

      <input id="search" class="search" type="search" placeholder="Search…" autocomplete="off" />

      <div id="filters" class="filters"></div>

      <div id="list" class="list"></div>

      <div class="row footer">
        <button type="button" id="copyRaw" class="ghost">Copy raw captures</button>
        <button type="button" id="dlRaw" class="ghost">Download raw</button>
        <button type="button" id="diagnose" class="ghost">Diagnostics</button>
      </div>

      <pre id="preview" class="preview"></pre>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
