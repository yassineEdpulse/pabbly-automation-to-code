  Data". The important discovery this fixture pins down: a code body is stored the SAME way as any
  other mapping value — a hidden textarea.map_data_value backed by TinyMCE — not in a code editor
  with its own model. So there is one write path for the whole extension, not two.

  Inside that value the code is HTML: newlines are <br>, blank lines are
  <span class="pabbly-connect-linebreak">, and mapped values are <span class="dynamic_value"> chips.
  The distinguishing attribute is data-enable_code_render="1".

  Traps this fixture deliberately keeps:
  - input.curr_api_url (hidden, value="method_url") — a code step has one, so a bare .curr_api_url
    selector picks up a non-field. The endpoint rule must require textarea.curr_api_url.
  - The mapping <select> carries "1. Events 0 Subject Url : https://secure.tutorcruncher.com/…",
    the exact string being searched for. Scanning step HTML rather than named fields reports it.
  - .api_response_con holds readonly response-preview textareas that must never be written.

  Secrets in the original capture (x-api-key, API_TOKEN) are replaced with placeholders here.
-->
